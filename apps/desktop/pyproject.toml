[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-live-marker"
version = "0.1.0"
description = "Desktop EMG live viewer, event marker, and recorder for an 8-channel Bluetooth transparent-serial wristband."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
emg-live-marker = "emg_live_marker.__main__:main"
emg-compare-gesture-models = "emg_live_marker.cli.compare_gesture_models:main"
emg-evaluate-realtime-smoothing = "emg_live_marker.cli.evaluate_realtime_smoothing:main"
emg-finetune-effie-gesture = "emg_live_marker.cli.finetune_effie_gesture:main"
emg-import-effie = "emg_live_marker.cli.import_effie:main"
emg-inspect-gesture-dataset = "emg_live_marker.cli.inspect_gesture_dataset:main"
emg-train-gesture-classifier = "emg_live_marker.cli.train_gesture_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["emg_live_marker*"]

[tool.setuptools.package-data]
emg_live_marker = ["assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
